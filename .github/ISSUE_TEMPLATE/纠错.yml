name: 纠错
description: 指出条目中的事实错误、缺失上下文或表述问题
title: '[纠错] '
labels: ['纠错']
body:
  - type: input
    id: page
    attributes:
      label: 涉及的条目
      description: 条目名称或链接
      placeholder: https://pcl2.n0th1n3ssd0ma1n.top/#/wiki/timeline
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: 哪里不对
      description: 引用原文片段，说明问题所在
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: 应该是什么
      description: 给出你认为正确的表述与依据
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: 依据
      description: 链接、截图、原文位置等
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 该 issue 不包含他人隐私信息
          required: true
